<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06101f">
<title>Community Help | MedRise</title>
<script>(function(){try{document.documentElement.dataset.theme=localStorage.getItem("medrise-theme")==="light"?"light":"dark"}catch(e){document.documentElement.dataset.theme="dark"}})();</script>
<script>(function(){var d=document.documentElement;d.style.visibility="hidden";window.__mrReveal=setTimeout(function(){d.style.visibility=""},8000)})();</script>
<style>
:root{color-scheme:dark;--bg:#050c16;--surface:#0a1625;--surface2:#0d1d30;--text:#f3f7ff;--muted:#a9bdd8;--border:#1d3652;--blue:#168bff;--cyan:#08d5ed;--green:#11d6a0;--gold:#ffbd45;--red:#ff5263}
[data-theme="light"]{color-scheme:light;--bg:#f5f8fd;--surface:#fff;--surface2:#edf4ff;--text:#101c31;--muted:#5e7395;--border:#d9e6f7;--blue:#0878f9;--cyan:#00aeca;--green:#079e78;--gold:#a66a00;--red:#d6213a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;line-height:1.5;padding-bottom:90px}
a{color:inherit;text-decoration:none}button,input,textarea{font:inherit}button{cursor:pointer}
.wrap{width:min(760px,100% - 28px);margin:auto}
.top{height:64px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}.logo{height:40px;width:40px;display:flex;align-items:center;justify-content:center;border:1px solid var(--cyan);border-radius:12px;background:#06101f;color:#fff;font-weight:800;letter-spacing:-1.5px}.logo span{color:var(--cyan)}
h1{font-size:28px;letter-spacing:-.8px;margin:18px 0 4px}.muted{color:var(--muted);font-size:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin:12px 0}
input[type=text],textarea{width:100%;padding:12px;border-radius:11px;border:1px solid var(--border);background:var(--bg);color:var(--text);outline:none;margin:5px 0;font-size:14px}
textarea{min-height:90px;resize:vertical}input:focus,textarea:focus{border-color:var(--cyan)}
.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:800;font-size:13px;background:linear-gradient(115deg,var(--cyan),var(--blue));color:#fff}.btn:disabled{opacity:.5}
.out{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:10px;padding:8px 11px;font-size:12px;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.sp{justify-content:space-between}
.tabs{display:flex;gap:7px;margin:12px 0}.tabs button{border:1px solid var(--border);border-radius:11px;padding:9px 13px;background:var(--surface);color:var(--text);font-size:12px;font-weight:700}.tabs button.on{background:linear-gradient(115deg,var(--cyan),var(--blue));border-color:transparent;color:#fff}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:10px;font-weight:700;border:1px solid var(--border)}.pill.open{color:var(--gold)}.pill.answered{color:var(--blue)}.pill.solved{color:var(--green)}.pill.priv{color:var(--muted)}
.post h3{font-size:15px;margin:6px 0 4px}.post p{margin:0;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.reply{border-left:3px solid var(--border);padding:6px 10px;margin:8px 0;background:var(--surface2);border-radius:0 10px 10px 0;font-size:13px}.reply.adm{border-left-color:var(--cyan)}.reply b{font-size:12px}.reply p{margin:3px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.chk{display:flex;gap:8px;align-items:center;font-size:12px;margin:6px 0}
.warn{border:1px solid var(--gold);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--gold);margin:10px 0}
.nav{position:fixed;bottom:0;left:0;right:0;border-top:1px solid var(--border);background:var(--bg);padding:8px 14px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center}.nav div{width:min(520px,100%);display:grid;grid-template-columns:repeat(5,1fr)}.nav a{display:flex;flex-direction:column;align-items:center;font-size:10px;font-weight:600;color:var(--muted)}.nav a span:first-child{font-size:21px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--blue);color:#fff;padding:9px 16px;border-radius:99px;font-size:12px;display:none;z-index:9}
[hidden]{display:none!important}
</style></head><body>
<div class="wrap">
<header class="top"><a class="brand" href="index.html"><span class="logo">M<span>R</span></span><span>MedRise</span></a><a class="out" href="notes.html">← Vault</a></header>
<h1>💬 Community Help</h1>
<div class="muted">Site par koi problem ho to yahan likho. MedRise team jawab degi.</div>
<div class="warn">⚠ Password, OTP ya poora UTR/phone number yahan mat likho. Personal baat ke liye "Sirf admin ko dikhe" chuno.</div>
<section class="card"><b>Nayi problem likho</b>
<input id="title" type="text" maxlength="100" placeholder="Problem ka short title">
<textarea id="body" maxlength="1500" placeholder="Kya hua? Kaunsa page / chapter / test? Detail me likho."></textarea>
<label class="chk"><input id="priv" type="checkbox"> 🔒 Sirf admin ko dikhe (payment / account issue)</label>
<button class="btn" id="post" type="button">Post karo</button></section>
<div class="tabs" id="tabs"><button class="on" data-t="all">Sab</button><button data-t="mine">Meri posts</button><button data-t="open">Unsolved</button></div>
<div id="list"><div class="card muted">Loading…</div></div>
</div>
<nav class="nav"><div><a href="index.html"><span>⌂</span><span>Home</span></a><a href="notes.html"><span>▤</span><span>Vault</span></a><a href="mocktest.html"><span>◴</span><span>Quiz</span></a><a href="community.html" style="color:var(--cyan)"><span>💬</span><span>Help</span></a><a href="dashboard.html"><span>♙</span><span>Profile</span></a></div></nav>
<div id="toast"></div>
<script src="chapters-data.js"></script>
<script type="module">
import app,{auth} from "./firebase.js";
import {onAuthStateChanged} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {getFirestore,doc,getDoc,addDoc,updateDoc,deleteDoc,getDocs,collection,query,where,limit,serverTimestamp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const db=getFirestore(app),$=id=>document.getElementById(id);
let me=null,isAdmin=false,posts=[],tab="all",openId=new URLSearchParams(location.search).get("post")||"";
const toast=t=>{const m=$("toast");m.textContent=t;m.style.display="block";clearTimeout(toast.i);toast.i=setTimeout(()=>m.style.display="none",2600)};
const ms=v=>v&&v.toMillis?v.toMillis():(Number(v)||Date.now());
const when=v=>new Date(ms(v)).toLocaleString([], {dateStyle:"medium",timeStyle:"short"});
const E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const who=()=>(me.displayName||(me.email||"").split("@")[0]||"Student").slice(0,40);
const run=async(fn,ok)=>{try{await fn();ok&&toast(ok)}catch(e){console.error(e);toast("Error: "+(e.code||e.message))}};
onAuthStateChanged(auth,async u=>{if(!u)return;me=u;
  try{isAdmin=(await getDoc(doc(db,"admins",u.uid))).exists()}catch(_){}
  if(!isAdmin)try{isAdmin=(await u.getIdTokenResult()).claims.admin===true}catch(_){}
  load()});
async function load(){
  try{const m=new Map();
    if(isAdmin)(await getDocs(query(collection(db,"posts"),limit(200)))).forEach(d=>m.set(d.id,{...d.data(),id:d.id}));
    else{(await getDocs(query(collection(db,"posts"),where("private","==",false),limit(100)))).forEach(d=>m.set(d.id,{...d.data(),id:d.id}));
      (await getDocs(query(collection(db,"posts"),where("uid","==",me.uid),limit(100)))).forEach(d=>m.set(d.id,{...d.data(),id:d.id}))}
    posts=[...m.values()].sort((a,b)=>ms(b.createdAt)-ms(a.createdAt));draw()}
  catch(e){$("list").replaceChildren(E("div","card muted","Load nahi hua: "+(e.code||e.message)))}}
$("post").onclick=()=>{const t=$("title").value.trim(),b=$("body").value.trim();
  if(t.length<3||b.length<3)return toast("Title aur detail dono likho");
  const btn=$("post");btn.disabled=true;
  run(async()=>{await addDoc(collection(db,"posts"),{uid:me.uid,name:who(),title:t,body:b,private:$("priv").checked,status:"open",createdAt:serverTimestamp()});$("title").value="";$("body").value="";$("priv").checked=false;await load()},"Post ho gayi ✅").finally(()=>btn.disabled=false)};
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));draw()});
function draw(){
  const l=posts.filter(p=>tab==="mine"?p.uid===me.uid:tab==="open"?p.status!=="solved":true),box=$("list");box.replaceChildren();
  if(!l.length){box.append(E("div","card muted","Abhi koi post nahi."));return}
  l.forEach(p=>{const c=E("article","card post"),top=E("div","row sp"),meta=E("span","muted",(p.name||"Student")+" · "+when(p.createdAt)),pills=E("span");
    const st=E("span","pill "+(p.status||"open"),p.status==="solved"?"✅ Solved":p.status==="answered"?"💬 Answered":"⏳ Open");pills.append(st);
    if(p.private)pills.append(" ",E("span","pill priv","🔒 Private"));top.append(meta,pills);
    c.append(top,E("h3","",p.title),E("p","",p.body));
    const det=E("div");det.hidden=p.id!==openId;
    const tog=E("button","out",det.hidden?"Replies / jawab dekho":"Band karo");tog.style.marginTop="10px";
    tog.onclick=async()=>{det.hidden=!det.hidden;tog.textContent=det.hidden?"Replies / jawab dekho":"Band karo";if(!det.hidden)await fill(p,det)};
    c.append(tog,det);box.append(c);if(!det.hidden)fill(p,det)})}
async function fill(p,det){det.replaceChildren(E("div","muted","Loading…"));let rs=[];
  try{(await getDocs(query(collection(db,"posts",p.id,"replies"),limit(200)))).forEach(d=>rs.push({...d.data(),id:d.id}))}catch(e){det.replaceChildren(E("div","muted","Replies load nahi hue"));return}
  rs.sort((a,b)=>ms(a.createdAt)-ms(b.createdAt));det.replaceChildren();
  rs.forEach(r=>{const x=E("div","reply"+(r.isAdmin?" adm":"")),h=E("b","",(r.isAdmin?"🛡 MedRise Team":r.name||"Student")+" · "+when(r.createdAt));x.append(h,E("p","",r.body));
    if(isAdmin||r.uid===me.uid){const d=E("button","out","🗑");d.style.cssText="float:right;padding:2px 7px";d.onclick=()=>confirm("Reply delete karni hai?")&&run(async()=>{await deleteDoc(doc(db,"posts",p.id,"replies",r.id));await fill(p,det)});x.prepend(d)}det.append(x)});
  const ta=E("textarea");ta.placeholder=isAdmin?"Admin reply likho…":"Reply likho…";ta.maxLength=1000;
  const row=E("div","row"),send=E("button","btn","Reply bhejo");
  send.onclick=()=>{const b=ta.value.trim();if(!b)return;send.disabled=true;
    run(async()=>{await addDoc(collection(db,"posts",p.id,"replies"),{uid:me.uid,name:isAdmin?"MedRise Team":who(),body:b,isAdmin,createdAt:serverTimestamp()});
      const ns=isAdmin?"answered":(p.uid===me.uid&&p.status!=="open"?"open":null);
      if(ns&&ns!==p.status){await updateDoc(doc(db,"posts",p.id),{status:ns});p.status=ns}
      await fill(p,det)},"Reply bhej di ✅").finally(()=>send.disabled=false)};
  row.append(send);
  if(isAdmin||p.uid===me.uid){const s=E("button","out",p.status==="solved"?"↺ Dobara kholo":"✅ Solved mark karo");s.onclick=()=>run(async()=>{const ns=p.status==="solved"?"open":"solved";await updateDoc(doc(db,"posts",p.id),{status:ns});p.status=ns;await load()},"Updated");row.append(s);
    const d=E("button","out","🗑 Post delete");d.onclick=()=>confirm("Poori post delete karni hai?")&&run(async()=>{await deleteDoc(doc(db,"posts",p.id));await load()},"Deleted");row.append(d)}
  det.append(ta,row)}
</script>
<script type="module" src="./auth-guard.js"></script>
</body></html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MedRise Admin</title>
    <style>
        #admin-content {
            display: none; 
        }
        #lock-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #0b0f19; /* MedRise default dark theme */
            color: white;
            font-family: 'Inter', sans-serif;
        }
        #lock-screen input {
            padding: 12px;
            margin: 15px 0;
            border-radius: 8px;
            border: 1px solid #333;
            width: 250px;
            background: #1a1f2b;
            color: white;
            text-align: center;
            font-size: 16px;
        }
        #lock-screen button {
            padding: 12px 30px;
            background-color: #00e6b8; /* MedRise Accent Green/Blue */
            color: #000;
            border: none;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div id="lock-screen">
        <h2>🔒 Board Member Access</h2>
        <input type="password" id="adminPin" placeholder="Enter PIN">
        <button onclick="checkAccess()">Unlock System</button>
        <p id="errorMsg" style="color: #ff4d4d; display: none; margin-top: 10px;">Incorrect PIN, Partner!</p>
    </div>

    <div id="admin-content">
        <!-- TUMHARA ASLI ADMIN PANEL CODE YAHAN AAYEGA -->
        <h1>Welcome to MedRise Admin Panel</h1>
        <p>Students data will load here.</p>
    </div>

    <script>
        function checkAccess() {
            const enteredPin = document.getElementById('adminPin').value;
            const correctPin = "598948"; 

            if (enteredPin === correctPin) {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }
    </script>
</body>
</html>

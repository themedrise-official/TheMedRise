<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050c16">
<title>MedRise Library | MedRise</title>
<script>try{var t=localStorage.getItem("medrise-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<script>(function(){var d=document.documentElement;d.style.visibility="hidden";window.__mrReveal=setTimeout(function(){d.style.visibility=""},8000)})();</script>
<style>
:root{--bg:#f4f8ff;--surface:#fff;--surface2:#edf4ff;--text:#101c31;--muted:#5e7395;--border:#d9e6f7;--blue:#0878f9;--cyan:#00aeca;--green:#079e78;--gold:#a66a00;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050c16;--surface:#0a1625;--surface2:#0e2034;--text:#f3f7ff;--muted:#a7bad3;--border:#1e3855;--blue:#168bff;--cyan:#08d5ed;--green:#11d6a0;--gold:#ffbd45;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#050c16;--surface:#0a1625;--surface2:#0e2034;--text:#f3f7ff;--muted:#a7bad3;--border:#1e3855;--blue:#168bff;--cyan:#08d5ed;--green:#11d6a0;--gold:#ffbd45;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
button,input,a{font:inherit;color:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}a{text-decoration:none}
.wrap{width:min(900px,calc(100% - 28px));margin:auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 85%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.top::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:11}
.top-in{height:62px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
.logo{height:38px;width:38px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--blue));display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800}
.ibtn{height:40px;width:40px;border:1px solid var(--border);border-radius:12px;background:var(--surface);font-size:17px}
.hero{border:1px solid var(--border);border-radius:20px;padding:18px;margin:14px 0 12px;background:linear-gradient(135deg,color-mix(in srgb,var(--cyan) 16%,var(--surface)),var(--surface))}
.eyebrow{font-size:10px;letter-spacing:1.5px;font-weight:800;color:var(--cyan);text-transform:uppercase}
.hero h1{margin:2px 0 4px;font-size:26px;line-height:1.2}.hero p{margin:0;color:var(--muted);font-size:13px}
.stats{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.stats span{font-size:11px;font-weight:700;border:1px solid var(--border);border-radius:99px;padding:4px 11px;background:var(--surface)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:0 12px;margin-bottom:6px}
.search input{flex:1;min-width:0;border:0;background:transparent;height:46px;outline:0;font-size:14px}
.search:focus-within{border-color:var(--cyan)}
h2.h{font-size:15px;margin:18px 2px 10px;display:flex;justify-content:space-between;align-items:center}
h2.h small{font-weight:600;color:var(--muted);font-size:11px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.fc{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:18px;padding:14px}
.fc::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--c)}
.fc:active{transform:scale(.98)}
.fi{height:46px;width:46px;border-radius:14px;display:grid;place-items:center;font-size:23px;background:color-mix(in srgb,var(--c) 18%,transparent);margin-bottom:2px}
.fc b{font-size:14px;line-height:1.3}.fc small{color:var(--muted);font-size:11px;line-height:1.4}
.fc .n{font-size:11px;font-weight:700;color:var(--c);margin-top:auto}
.rail{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}.rail::-webkit-scrollbar{display:none}
.rail .it{min-width:250px;flex:none}
.it{display:flex;gap:11px;align-items:center;border:1px solid var(--border);background:var(--surface);border-radius:16px;padding:11px}
.list{display:flex;flex-direction:column;gap:9px}
.ti{flex:none;height:42px;width:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--surface2)}
.tx{min-width:0;flex:1}.tx b{display:block;font-size:13.5px;line-height:1.35;overflow-wrap:anywhere}
.tx small{display:block;color:var(--muted);font-size:11.5px;line-height:1.4;margin-top:1px;overflow-wrap:anywhere}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}.chips i{font-style:normal;font-size:10px;font-weight:700;border:1px solid var(--border);border-radius:99px;padding:0 7px;color:var(--muted)}
.chips i.new{color:var(--green);border-color:var(--green)}
.open{flex:none;border-radius:11px;padding:8px 13px;font-size:12px;font-weight:800;background:linear-gradient(115deg,var(--cyan),var(--blue));color:#fff}
.back{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:11px;padding:7px 12px;font-size:12px;font-weight:700;margin:12px 0 4px}
.fh{display:flex;align-items:center;gap:12px;margin:10px 0 6px}.fh .fi{height:52px;width:52px;font-size:26px}.fh h1{margin:0;font-size:22px;line-height:1.2}.fh p{margin:2px 0 0;color:var(--muted);font-size:12px}
.state{text-align:center;border:1px dashed var(--border);border-radius:16px;padding:26px 16px;color:var(--muted);font-size:13px;margin-top:12px}
.state button{margin-top:10px;border:1px solid var(--cyan);color:var(--cyan);background:transparent;border-radius:10px;padding:8px 16px;font-weight:700}
.sk{height:96px;border-radius:18px;background:linear-gradient(90deg,var(--surface),var(--surface2),var(--surface));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.sk{animation:none}.fc:active{transform:none}}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:9;border-top:1px solid var(--border);background:var(--bg);padding:7px 14px calc(7px + env(safe-area-inset-bottom,0px))}
.nav div{width:min(520px,100%);margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;font-size:10px;font-weight:600;color:var(--muted);padding:3px}.nav a span:first-child{font-size:20px}.nav a.on{color:var(--cyan)}
</style>
</head>
<body>
<header class="top"><div class="wrap top-in">
  <a class="brand" href="index.html"><span class="logo">MR</span><span>MedRise Library</span></a>
  <button class="ibtn" id="theme" aria-label="Theme">☼</button>
</div></header>

<main class="wrap">
  <section class="hero"><div class="eyebrow">Study Library</div><h1>Sab kuch ek jagah</h1><p>Physics, Chemistry, Biology aur MedRise ke specially designed notes aur tools.</p><div class="stats" id="stats"></div></section>
  <label class="search"><span aria-hidden="true">🔍</span><input id="q" type="search" placeholder="Notes, formula sheet ya tool dhundo…" autocomplete="off"></label>
  <div id="view"></div>
</main>

<nav class="nav"><div>
  <a href="index.html"><span>⌂</span><span>Home</span></a><a href="notes.html"><span>▤</span><span>Vault</span></a><a href="mocktest.html"><span>◴</span><span>Quiz</span></a><a href="community.html"><span>💬</span><span>Help</span></a><a href="dashboard.html"><span>♙</span><span>Profile</span></a>
</div></nav>

<script>
const $=id=>document.getElementById(id);
const COL={blue:"#168bff",green:"#11d6a0",cyan:"#08d5ed",gold:"#ffbd45",pink:"#ff6fa8",purple:"#9b7bff",orange:"#ff8a3d",red:"#ff5263"};
const TYPE={pdf:["📄","PDF"],note:["📝","Notes"],tool:["🛠️","Tool"],video:["▶️","Video"],link:["🔗","Link"]};
let F=[],I=[],ready=false;
function setTheme(t){document.documentElement.dataset.theme=t;$("theme").textContent=t==="dark"?"☼":"☾";try{localStorage.setItem("medrise-theme",t)}catch(e){}}
const isDark=()=>document.documentElement.dataset.theme?document.documentElement.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
$("theme").textContent=isDark()?"☼":"☾";$("theme").onclick=()=>setTheme(isDark()?"light":"dark");
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
const view=$("view"),isNew=i=>Date.now()-(Number(i.createdAt)||0)<7*864e5;
const col=f=>COL[f.color]||COL.blue,fol=id=>F.find(f=>f.id===id);
function state(msg,retry){const s=el("div","state",msg);if(retry){const b=el("button",null,"Dobara try karo");b.onclick=boot;s.append(b)}view.replaceChildren(s)}

function itemRow(i,showFolder){
  const m=TYPE[i.type]||TYPE.link,r=el("div","it"),ic=el("div","ti",m[0]),tx=el("div","tx"),chips=el("div","chips");
  tx.append(el("b",null,i.title));if(i.desc)tx.append(el("small",null,i.desc));
  chips.append(el("i",null,m[1]));if(showFolder&&fol(i.folderId))chips.append(el("i",null,fol(i.folderId).name));if(isNew(i))chips.append(el("i","new","NEW"));tx.append(chips);
  r.append(ic,tx);
  if(/^https:\/\//.test(i.url||"")){const a=el("a","open","Open");a.href=i.url;a.target="_blank";a.rel="noopener noreferrer";r.append(a)}
  return r}
function folderCard(f){
  const n=I.filter(i=>i.folderId===f.id).length,b=el("button","fc");b.style.setProperty("--c",col(f));
  const ic=el("div","fi",f.icon||"📁");b.append(ic,el("b",null,f.name));if(f.desc)b.append(el("small",null,f.desc));b.append(el("span","n",n+(n===1?" resource":" resources")));
  b.onclick=()=>{location.hash="f="+f.id};return b}

function home(){
  const g=el("div","grid");F.forEach(f=>g.append(folderCard(f)));
  const parts=[];
  const recent=[...I].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,6);
  if(recent.length){const h=el("h2","h","Recently added");const rail=el("div","rail");recent.forEach(i=>rail.append(itemRow(i,true)));parts.push(h,rail)}
  const h2=el("h2","h","Folders");h2.append(el("small",null,F.length+" folders"));parts.push(h2,g);
  view.replaceChildren(...parts);$("stats").replaceChildren(el("span",null,F.length+" folders"),el("span",null,I.length+" resources"))}
function folderView(f){
  const back=el("a","back","← Library");back.href="#";back.onclick=e=>{e.preventDefault();location.hash=""};
  const fh=el("div","fh"),ic=el("div","fi",f.icon||"📁"),t=el("div");ic.style.setProperty("--c",col(f));
  t.append(el("h1",null,f.name));if(f.desc)t.append(el("p",null,f.desc));fh.append(ic,t);
  const items=I.filter(i=>i.folderId===f.id).sort((a,b)=>(a.order||0)-(b.order||0)||(b.createdAt||0)-(a.createdAt||0));
  const list=el("div","list");items.forEach(i=>list.append(itemRow(i,false)));
  view.replaceChildren(back,fh,items.length?list:el("div","state","Is folder mein abhi kuch nahi hai. Jald hi naye notes aur tools aayenge."));window.scrollTo({top:0})}
function search(q){
  const s=q.trim().toLowerCase(),r=I.filter(i=>(i.title+" "+(i.desc||"")+" "+((fol(i.folderId)||{}).name||"")+" "+((TYPE[i.type]||[])[1]||"")).toLowerCase().includes(s));
  const list=el("div","list");r.forEach(i=>list.append(itemRow(i,true)));
  view.replaceChildren(el("h2","h","Search results ("+r.length+")"),r.length?list:el("div","state","Kuch nahi mila. Dusra shabd try karo."))}
function route(){
  if(!ready)return;const q=$("q").value;if(q.trim()){search(q);return}
  const m=location.hash.match(/^#f=(.+)$/),f=m&&fol(decodeURIComponent(m[1]));
  if(f)folderView(f);else if(!F.length)state("MedRise Library jald aa rahi hai. Naye notes aur tools yahan milenge.");else home()}
$("q").oninput=route;window.addEventListener("hashchange",route);

async function boot(){
  view.replaceChildren(el("div","sk"),el("div","sk"));
  try{
    const a=await import("./firebase.js"),au=await import("https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js"),fs=await import("https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js");
    const u=await new Promise(r=>au.onAuthStateChanged(a.auth||au.getAuth(a.default),r));
    if(!u){state("Library dekhne ke liye login karo.");return}
    const db=fs.getFirestore(a.default),live=c=>fs.getDocs(fs.query(fs.collection(db,c),fs.where("live","==",true)));
    const [x,y]=await Promise.all([live("libFolders"),live("libItems")]);
    F=x.docs.map(d=>({id:d.id,...d.data()})).sort((p,q)=>(p.order||0)-(q.order||0));
    const ok=new Set(F.map(f=>f.id));I=y.docs.map(d=>({id:d.id,...d.data()})).filter(i=>ok.has(i.folderId));
    ready=true;route()
  }catch(e){console.error(e);state("Library abhi load nahi ho payi. Baaki website normal chal rahi hai.",true)}}
boot();
</script>
<script type="module" src="./auth-guard.js"></script>
</body>
</html>
